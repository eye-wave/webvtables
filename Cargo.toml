
cargo-features = ["profile-rustflags", "trim-paths", "panic-immediate-abort"]

[package]
name = "webvtlabes"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
test = false

[dependencies]
bitflags = "2"
paste = "1"
libm = "0.2.16"
microfft = { version = "0.6", default-features = false, features = [
  "size-2048",
] }
wee_alloc = { version = "0.4.5", features = ["static_array_backend"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "immediate-abort"
strip = true
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
