
cargo-features = ["profile-rustflags", "panic-immediate-abort"]

[package]
name = "webvtlabes"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bitflags = "2"
dlmalloc = { version = "0.2", features = ["global"] }
libm = "0.2.16"
microfft = { version = "0.6", default-features = false, features = [
  "size-2048",
] }
paste = "1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
