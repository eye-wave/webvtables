<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>webvtables</title>
    <meta
      name="description"
      content="Node editor for creating wavetable files."
    />

    <meta property="og:url" content="https://eye-wave.github.io/webvtables/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="webvtables" />
    <meta
      property="og:description"
      content="Node editor for creating wavetable files."
    />
    <meta
      property="og:image"
      content="https://eye-wave.github.io/webvtables/site-preview.avif"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="eye-wave.github.io" />
    <meta
      property="twitter:url"
      content="https://eye-wave.github.io/webvtables/"
    />
    <meta name="twitter:title" content="webvtables" />
    <meta
      name="twitter:description"
      content="Node editor for creating wavetable files."
    />
    <meta
      name="twitter:image"
      content="https://eye-wave.github.io/webvtables/site-preview.avif"
    />

    <title>webvtabes</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="narrow" role="alert" hidden>
      <b>Screen too narrow</b>
      <span
        >This editor needs a wider view. Rotate your phone to landscape or use a
        larger screen.</span
      >
    </div>
    <div class="box box-playback"></div>
    <div class="box box-node-grid">
      <div id="fps" hidden></div>
      <div id="gridBg"></div>
      <div id="nodeGrid"></div>
      <div class="heightmap"></div>
      <canvas class="overlay-canvas" id="canvas"></canvas>
    </div>
    <div class="resize-handle" id="kfHandle"></div>
    <div class="box box-keyframes">
      <div class="kf" id="kfRoot" tabindex="0">
        <div class="kf-scroll" id="kfScroll">
          <div class="kf-inner" id="kfInner">
            <div class="kf-row kf-ruler">
              <div class="kf-label">
                <button id="kfNew" type="button">+ New</button>
              </div>
              <div class="kf-track" id="kfTrack">
                <span class="kf-tick" data-f="0">0</span
                ><span class="kf-tick" data-f="32">32</span
                ><span class="kf-tick" data-f="64">64</span
                ><span class="kf-tick" data-f="96">96</span
                ><span class="kf-tick" data-f="128">128</span
                ><span class="kf-tick" data-f="160">160</span
                ><span class="kf-tick" data-f="192">192</span
                ><span class="kf-tick" data-f="224">224</span
                ><span class="kf-tick end" data-f="255">255</span>
              </div>
            </div>
            <div id="kfLanes" style="display: contents"></div>
            <p class="kf-empty" id="kfEmpty">No lanes - add one</p>
            <div class="kf-head" id="kfHead"></div>
          </div>
        </div>
      </div>
    </div>

    <input id="fileInput" type="file" accept=".wtp,.wtx" hidden />

    <dialog id="fileDialog" style="display: none">
      <div class="file-body">
        <header>
          <h2>Project</h2>
          <button id="fileClose" type="button" title="Close">×</button>
        </header>
        <label class="file-name">
          <span>Name</span>
          <input
            id="fileName"
            value="project"
            spellcheck="false"
            autocomplete="off"
            maxlength="48"
          />
        </label>
        <div class="file-row">
          <div>
            <b>Save project</b
            ><small
              >.wtp · graph, params &amp; keyframes (.wtx with Data
              nodes)</small
            >
          </div>
          <button id="fileSave" type="button">Save</button>
        </div>
        <form id="fileExportForm" class="file-row file-form">
          <div><b>Export wavetable</b><small id="fileInfo"></small></div>
          <label>
            Quality
            <select id="fileQuality">
              <option value="1">1 · lossless</option>
              <option value="2">1/2</option>
              <option value="4">1/4</option>
              <option value="8">1/8</option>
              <option value="16">1/16</option>
              <option value="32">1/32</option>
              <option value="64">1/64</option>
            </select>
          </label>
          <label>
            Interpolation
            <select id="fileInterp" disabled>
              <option value="1">Crossfade</option>
              <option value="2">Spectral</option>
            </select>
          </label>
          <button id="fileExport" type="submit">Export</button>
        </form>
        <div id="fileDrop">
          Drop a <b>.wtp</b> / <b>.wtx</b> project here or
          <button id="fileBrowse" type="button">browse…</button>
        </div>
        <p id="fileMsg" role="status"></p>
      </div>
    </dialog>
    <dialog id="settingsDialog" style="display: none">
      <div class="file-body" id="settingsRoot"></div>
    </dialog>
  </body>
</html>
