<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>webvtables</title>
    <meta
      name="description"
      content="Node editor for creating wavetable files."
    />

    <meta property="og:url" content="https://eye-wave.github.io/webvtables/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="webvtables" />
    <meta
      property="og:description"
      content="Node editor for creating wavetable files."
    />
    <meta
      property="og:image"
      content="https://eye-wave.github.io/webvtables/site-preview.avif"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="eye-wave.github.io" />
    <meta
      property="twitter:url"
      content="https://eye-wave.github.io/webvtables/"
    />
    <meta name="twitter:title" content="webvtables" />
    <meta
      name="twitter:description"
      content="Node editor for creating wavetable files."
    />
    <meta
      name="twitter:image"
      content="https://eye-wave.github.io/webvtables/site-preview.avif"
    />

    <title>webvtabes</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="box box-playback"></div>
    <div class="box box-node-grid">
      <div id="gridBg"></div>
      <div id="nodeGrid"></div>
      <canvas class="overlay-canvas" id="canvas"></canvas>
      <canvas class="heightmap" id="heightmap"></canvas>
    </div>
    <div class="resize-handle" id="kfHandle"></div>
    <div class="box box-keyframes"></div>
    <dialog id="fileDialog" style="display: none">
      <div class="file-body">
        <header>
          <h2>Project</h2>
          <button id="fileClose" type="button" title="Close">×</button>
        </header>
        <label class="file-name">
          <span>Name</span>
          <input id="fileName" value="project" spellcheck="false" autocomplete="off" maxlength="48" />
        </label>
        <div class="file-row">
          <div><b>Save project</b><small>.wtp · graph, params &amp; keyframes</small></div>
          <button id="fileSave" type="button">Save</button>
        </div>
        <div class="file-row">
          <div><b>Export wavetable</b><small>.wav · all 256 frames, 32-bit float</small></div>
          <button id="fileExport" type="button">Export</button>
        </div>
        <div id="fileDrop">
          Drop a <b>.wtp</b> project here or
          <button id="fileBrowse" type="button">browse…</button>
          <input id="fileInput" type="file" accept=".wtp" hidden />
        </div>
        <p id="fileMsg" role="status"></p>
      </div>
    </dialog>
  </body>
</html>
